# 分类规则表：标题 + #话题标签 关键词 → 目录
#
# 规则**从上往下匹配，第一个命中就定**，所以顺序即优先级。
# 这批规则是从实际入库的 30 条里聚出来的，不是拍脑袋想的。
#
# 命中判定：只要 tags 里任一标签、或标题里任一关键词出现，即算命中。
# 一条都没命中的落到 _待分类/，回头人工看一眼再往这里补规则。
#
# ⚠️ 顺序上的两个坑：
# 1. AI 产业必须排在 AI 工程前面。产业类视频也带 #大模型 #AI大模型 这种泛标签，
#    排后面会被工程类的标签规则先抢走（「美国模型领先15个月」就是这种）。
# 2. 社会观察排在经济前面。「AI取代工作」「三亿人单身潮」讲的是人的处境，
#    虽然满篇经济词，但归到经济里以后就找不着了。
# 3. ⛔ 别往关键词里放「拆解」「解读」「深度」「打工」这类抖音标题万金油。
#    实测「拆解」一个词就把《日元贬值》和《经济学原理》两条全吸进了 AI-工程。

[[rule]]
name = "AI-产业观察"
desc = "AI 这门生意本身：泡沫、融资、算力账、中美竞争、企业落地"
tags = ["Anthropic", "开复说AI", "企业AI变革", "中美AI", "美债", "宏观经济"]
keywords = [
    "泡沫", "融资", "芯片折旧", "算力", "估值", "不可能三角",
    "领先15个月", "中美", "AI化改造", "AI变革", "商业化", "回本",
]

[[rule]]
name = "AI-工程实践"
desc = "能上手做的：框架、架构、Agent、原理拆解、AI 编程工作流"
tags = [
    "Agent", "AIAgent", "RAG", "LLM", "langchain", "DeepSeek",
    "AI编程", "ClaudeCode", "Codex", "vibecoding", "vibecoding大赏",
    "AI原生ERP", "LLMwiki", "AI大模型", "大模型", "大模型学习", "AI前沿技术",
]
keywords = [
    "LangChain", "Agent", "RAG", "prompt", "Skills", "Claude", "Codex",
    "架构", "工作流", "智能体", "向量", "token", "微调", "ERP",
    "Remotion", "Wiki", "开源", "特效", "提示词",
]

[[rule]]
name = "量化投资"
desc = "量化系统、策略、交易"
tags = ["量化系统", "量化交易", "量化策略"]
keywords = ["量化"]

[[rule]]
name = "社会观察"
desc = "人的处境：就业、婚育、人口、代际、性别"

# 分类规则表：标题 + #话题标签 关键词 → 目录
#
# 规则**从上往下匹配，第一个命中就定**，所以顺序即优先级。
# 规则是从库里 791 条真实数据聚出来的，不是拍脑袋想的。
#
# 命中判定：只要 tags 里任一标签、或标题里任一关键词出现，即算命中。
# 一条都没命中的留在 inbox/ 根目录，回头看一眼再往这里补规则。
#
# ⚠️ 顺序上的坑（都是实测踩出来的）：
# 1. 面试题排最前。它和 AI 三类内容高度重叠（Agent memory、RAG、容错既是
#    面试题也是工程知识），排后面会被 #Agent #大模型 全部抢走。
# 2. AI 产业排在 AI 三类前面。产业类也带 #大模型 #AI大模型 这种泛标签。
# 3. 社会观察排在经济前面。「AI取代工作」「三亿人单身潮」讲的是人的处境，
#    归到经济里以后就找不着了。
# 4. ⛔ 别放「拆解」「解读」「深度」「打工」「实习」「求职」这类万金油。
#    实测：一个「拆解」把《日元贬值》和《经济学原理》吸进了 AI 类；
#    「实习」「求职」把《职校实习》《美国加税的行业》误判成面试题。
#
# ⚠️ AI 为什么拆成四类：不拆的话 AI-工程实践 会吃掉全库 47%（370/791），
#    一个文件夹装半个库等于没分类。按「拿来干什么」拆：
#    产业观察=看行情 / 编程工具=我写代码用 / 应用落地=别人怎么用起来 / 原理架构=搞懂它怎么转。

[[rule]]
name = "面试题"

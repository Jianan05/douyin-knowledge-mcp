    "社会观察", "灵活就业", "人口", "生育率", "单身", "结婚", "彩礼",
    "两性", "情绪双标", "人性", "东北", "黑龙江", "韩国", "年轻人",
]
keywords = [
    "灵活就业", "单身", "生育", "人口", "彩礼", "取代工作", "调头",
    "弱势", "情绪", "嫁",
]

[[rule]]
